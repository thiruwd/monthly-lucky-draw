services:
  - type: web
    name: monthly-lucky-draw
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: APP_ORIGIN
        sync: false
      - key: SUPABASE_URL
        value: https://ezscaztczotpbuqgurjc.supabase.co
      - key: SUPABASE_DATABASE_URL
        sync: false
